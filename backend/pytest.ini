[pytest]
# Default run covers the unit suite only: offline, no database required.
# The live Supabase suite lives in `integration_live/` (outside testpaths) and
# is opt-in:  pytest integration_live        (see integration_live/README.md)
testpaths = tests
pythonpath = .
addopts = -q
markers =
    live: requires a live Supabase project (opt-in, never part of CI)
filterwarnings =
    ignore::DeprecationWarning
